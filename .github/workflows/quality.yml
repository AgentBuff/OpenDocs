name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, tests and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: node scripts/check-generated-api-contract.mjs
      - run: node scripts/dependency-audit.mjs
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm architecture:check
        working-directory: web
      - run: pnpm contract:check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  browser:
    name: Browser persistence and visual regression
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e --project=chromium
        working-directory: web
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
